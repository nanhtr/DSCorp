<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Phối Tối Giản Sang Trọng #FFF5F9</title>
    <style>
        /* CSS Reset & Thiết lập chung */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            /* 60% Diện tích: Nền chính trắng hồng tinh khiết #FFF5F9 */
            background-color: #FFF5F9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #7D636B; /* Chữ phụ mặc định */
        }

        /* Thẻ Card (30% diện tích): Trắng tinh khiết #FFFFFF tạo hiệu ứng phân lớp cao cấp */
        .luxury-card {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 35px rgba(125, 99, 107, 0.05); /* Đổ bóng siêu nhẹ, thanh lịch */
            /* Đường viền mảnh màu hồng phấn trung tính #E8BACB để định hình cấu trúc */
            border: 1px solid #E8BACB;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin: 20px;
        }

        .luxury-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(125, 99, 107, 0.08);
            border-color: #C15C81; /* Chuyển nhẹ sang màu nhấn khi hover */
        }

        /* Icon / Badge phía trên */
        .card-icon {
            width: 64px;
            height: 64px;
            background-color: #FFF5F9; /* Đồng điệu với màu nền chính */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
            border: 1px solid #E8BACB;
        }

        .card-icon svg {
            width: 28px;
            height: 28px;
            fill: #C15C81; /* Màu nhấn nổi bật */
        }

        /* Nhãn phụ (Màu hồng phấn trung tính #E8BACB) */
        .card-subtitle {
            font-size: 0.75rem;
            font-weight: 700;
            color: #E8BACB;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: block;
        }

        /* Tiêu đề chính in đậm: Cực kỳ sắc nét với màu gỗ mun ánh tím #3A242B */
        .card-title {
            color: #3A242B;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 14px 0;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        /* Chữ phụ (Mô tả): Màu hồng đất xám #7D636B nhã nhặn, đọc lâu không mỏi mắt */
        .card-desc {
            color: #7D636B;
            font-size: 0.92rem;
            line-height: 1.65;
            margin: 0 0 28px 0;
        }

        /* Nút kêu gọi hành động (10% diện tích): Màu nhấn #C15C81 sang trọng */
        .card-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #C15C81;
            /* Chữ in đậm màu trắng tinh khiết #FFFFFF bên trong nút */
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(193, 92, 129, 0.2);
        }

        .card-btn:hover {
            background-color: #A34567; /* Đậm hơn một chút khi hover để tạo tương tác */
            box-shadow: 0 6px 20px rgba(193, 92, 129, 0.3);
            transform: translateY(-1px);
        }

        .card-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Giao diện Card Tối Giản Cao Cấp -->
    <div class="luxury-card">
        <!-- Icon minh họa tinh tế -->
        <div class="card-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <span class="card-subtitle">La Rose Luxury</span>
        <h2 class="card-title">Nước Hoa Trầm Hương</h2>
        <p class="card-desc">Một bản giao hương quý phái giữa tinh dầu hoa hồng Pháp quý hiếm và trầm hương ấm áp, đánh thức mọi giác quan ngay chạm đầu tiên.</p>
        <button class="card-btn">Trải Nghiệm Ngay</button>
    </div>

</body>
</html>
